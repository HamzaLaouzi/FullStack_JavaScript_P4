<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Voluntariados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Voluntariado</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="voluntariado.html">Voluntariados</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Alta Usuario</a></li>
          <li class="nav-item"><span id="nav-user" class="nav-link text-muted">-no login-</span></li>
        </ul>
      </div>
    </div>
  </nav>

<div id="voluntariados" class="container-fluid">
      <div class="bg-light py-5 text-center"><h2>GESTIÓN DE VOLUNTARIADOS</h2></div>
    <div class="container-fluid">
        <div class="container col-md-10 col-lg-8">
          <div class="row row-cols-1 row-cols-lg-2 g-4">
            <div class="col text-center">
              <h4>ALTA DE VOLUNTARIADO</h4>
              <form id="voluntariadoForm">
                <div class="mb-3">
                  <label for="newVolTitleId" class="form-label">Título</label>
                  <input type="text" class="form-control" id="newVolTitleId" required>
                </div>
                <div class="mb-3">
                  <label for="newVolEmailId" class="form-label">Usuario (Email)</label>
                  <input type="email" class="form-control" id="newVolEmailId" placeholder="Introduce tu email" required>
                </div>
                <div class="mb-3">
                  <label for="volDateId" class="form-label">Fecha</label>
                  <input type="date" class="form-control" id="volDateId" required>
                </div>
                <div class="mb-3">
                  <label for="newVolDescriptionId" class="form-label">Descripción</label>
                  <textarea class="form-control" id="newVolDescriptionId" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                  <label for="volSelectId" class="form-label">Tipo</label>
                  <select class="form-select" id="volSelectId">
                    <option value="Petición" selected>Petición</option>
                    <option value="Oferta">Oferta</option>
                  </select>
                </div>
                <button type="button" id="submitId" class="btn btn-primary">Dar de alta</button>
              </form>
            </div>

            <div class="col text-center">
              <h4>CONSULTA Y BORRADO</h4>
              <div class="table-responsive shadow-sm rounded">
                <table id="volTableId" class="table table-hover table-striped table-bordered mb-0">
                  <tr class="table-dark">
                    <th scope="col">Email</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Título</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Acciones</th>
                  </tr>
                  <tbody id="volTableBody">
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="container-fluid py-5">
        <div class="container col-md-10 col-lg-8">
            <h4 class="text-center mb-4">GRÁFICO DE VOLUNTARIADOS (Peticiones vs Ofertas)</h4>
            <canvas id="canvas" width="600" height="250" class="border rounded p-3 bg-white shadow-sm d-block mx-auto"></canvas>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/voluntariado.js"></script>
</body>
</html>
