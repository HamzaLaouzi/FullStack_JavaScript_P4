<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Voluntariado</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="voluntariado.html">Voluntariados</a></li>
            <li><a href="usuarios.html">Usuarios</a></li>
            <li id="usuarioActivo">-no login-</li>
        </ul>
    </nav>

    <div class="container">
        <section class="alta-usuario">
            <h2>Alta de Usuario</h2>
            <form id="formAltaUsuario">
                <div class="form-group">
                    <label for="alta-usr-name">Nombre:</label>
                    <input type="text" id="alta-usr-name" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="alta-usr-email">Correo electrónico:</label>
                    <input type="email" id="alta-usr-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="alta-usr-pswrd">Contraseña:</label>
                    <input type="password" id="alta-usr-pswrd" name="password" required>
                </div>
                <button type="submit">Dar de Alta</button>
            </form>
        </section>

        <section class="consulta-usuarios">
            <h2>Consulta y Borrado de Usuarios</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo electrónico</th>
                        <th>Contraseña</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Aquí se insertarán los usuarios dinámicamente -->
                </tbody>
            </table>
        </section>
    </div>

    <script type="module" src="assets/js/usuarios.js"></script>
</body>
</html>
