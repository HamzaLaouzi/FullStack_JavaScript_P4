<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ruedas de Esperanza</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/styles.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Voluntariado</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="index.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="voluntariado.html">Voluntariados</a></li>
                        <li class="nav-item"><a class="nav-link" href="registro.html">Alta Usuario</a></li>
                        <li class="nav-item"><span id="nav-user" class="nav-link text-muted">-no login-</span></li>
                    </ul>
                </div>
            </div>
        </nav>
        <section class="container-fluid p-0">
            <img src="assets/img/holding-hands-8649669_1280.jpg" alt="Banner Ruedas de Esperanza" class="img-fluid w-100" style="max-height: 360px; object-fit: cover; object-position: center;" />
        </section>
        <main class="container">
            <section class="text-center my-4">
                <h1 class="display-5 title-marker">Dashboard de Voluntariado Ruedas de Esperanza</h1>
                <div class="d-flex justify-content-center gap-2 mt-3">
                    <button id="tab-peticiones" data-filter="Petición" type="button" class="btn btn-outline-primary px-4">Peticiones</button>
                    <button id="tab-ofertas" data-filter="Oferta" type="button" class="btn btn-outline-primary px-4">Ofertas</button>
                    <button id="tab-todas" data-filter="todos" type="button" class="btn btn-primary px-4">Todas</button>
                </div>
            </section>
            
            <section>
                <div class="row">
                    <div class="col-lg-8">
                        <h3 class="mt-4 mt-lg-0">Voluntariados Disponibles</h3>
                        <div id="dragContainer" class="row row-cols-1 row-cols-md-2 g-4">
                            </div>
                    </div>
                    
                    <div class="col-lg-4">
                        <h3 class="mt-4 mt-lg-0">Mi Selección <small class="text-muted">(Arrastra aquí)</small></h3>
                        <div id="dropContainer" class="border p-3 rounded bg-light min-vh-50 shadow-sm">
                            <p class="text-muted text-center my-5">Arrastra aquí los voluntariados que te interesen.</p>
                            </div>
                    </div>
                </div>
            </section>
            
            <template id="card-template">
                <div class="col">
                    <article class="card vol-card vol-card--blue h-100 shadow" draggable="true"> 
                        <div class="card-body">
                            <h5 class="card-title vol-card__title">TÍTULO</h5>
                            <p class="vol-card__date mb-2">FECHA</p>
                            <p class="card-text vol-card__desc">DESCRIPCIÓN</p>
                            <p class="vol-card__author mt-3 mb-0">Publicado por: <span class="vol-card__author-name">NOMBRE</span></p>
                        </div>
                    </article>
                </div>
            </template>
        </main>
        <footer class="container">
            <small>&copy; <span id="year"></span> Ruedas de Esperanza</small>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="assets/js/index.js"></script>
    </body>
</html>
